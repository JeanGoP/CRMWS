services:
  hilora:
    build:
      context: .
      dockerfile: Dockerfile
      target: multiempresa
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    environment:
      SERVICE_URL_HILORA_3000: /
      APP_BASE_URL: ${SERVICE_URL_HILORA_3000}
      DATABASE_URL: postgresql://hilora_multiempresa:${SERVICE_PASSWORD_64_HILORADB}@hilora-db:5432/hilora_multiempresa
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_HILORASESION}
      HILORA_LLAVE_CIFRADO: ${SERVICE_PASSWORD_64_HILORACIFRADO}
      META_WEBHOOK_VERIFY_TOKEN: ${SERVICE_PASSWORD_HILORAVERIFY}
      MULTIEMPRESA_PRODUCCION: "on"
      MULTIEMPRESA_CANALES: ${MULTIEMPRESA_CANALES:-on}
      CHANNELS: whatsapp,telegram
      MULTIEMPRESA_ADMIN_EMAIL: ${MULTIEMPRESA_ADMIN_EMAIL}
      HILORA_ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_HILORAACCESO}
      HILORA_PRUEBA_LOCAL: ${HILORA_PRUEBA_LOCAL:-off}
      AGENDA: "on"
    volumes:
      - hilora-adjuntos:/data
    depends_on:
      hilora-db:
        condition: service_healthy
    networks:
      - default
      - datos-hilora
    restart: unless-stopped

  hilora-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hilora_multiempresa
      POSTGRES_USER: hilora_multiempresa
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_HILORADB}
    volumes:
      - hilora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hilora_multiempresa", "-d", "hilora_multiempresa"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - datos-hilora
    restart: unless-stopped

volumes:
  hilora-postgres:
  hilora-adjuntos:

networks:
  datos-hilora:
    internal: true
